<div class="modal-content">
  <h2>📈 Statistiques</h2>
  <p>Données collectées :</p>
  <ul>
    <li>Nombre total d’utilisateurs : <span id="nb-users">Chargement...</span></li>
    <li>Diagnostics effectués : <span id="nb-diagnostics">Chargement...</span></li>
  </ul>
</div>

<script>
  async function loadStatistics() {
    const nbUsersEl = document.getElementById("nb-users");
    const nbDiagEl = document.getElementById("nb-diagnostics");

    const token = localStorage.getItem("access_token");
    if (!token) {
      nbUsersEl.textContent = "Non connecté";
      nbDiagEl.textContent = "Non connecté";
      return;
    }
   
    try {
      const response = await fetch("http://127.0.0.1:8000/api/statistiques", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });
      if (!response.ok) throw new Error("Erreur réseau");
      const data = await response.json();

      // Attention aux clés selon ton API backend
      nbUsersEl.textContent = data.utilisateurs ?? "N/A";
      nbDiagEl.textContent = data.diagnostics ?? "N/A";

    } catch (error) {
      console.error("Erreur lors du chargement des statistiques :", error);
      nbUsersEl.textContent = "Erreur";
      nbDiagEl.textContent = "Erreur";
    }
  }

  // Charger les stats dès que ce script s'exécute
  loadStatistics();
</script>
